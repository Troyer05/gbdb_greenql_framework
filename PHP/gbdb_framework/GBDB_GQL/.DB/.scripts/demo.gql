# ============================================================
# 13) PEEK / PICK / WHERE / SORT / LIMIT / OFFSET / MAX
# ============================================================

PEEK users IN main LIMIT 10;
PEEK posts IN main LIMIT 10;

PICK * FROM users IN main LIMIT 50;

PICK uid, username, role, status, score
FROM users
IN main
WHERE status = "active"
SORT score DESC
LIMIT 10
OFFSET 0;

PICK uid, username, age FROM users IN main WHERE age >= 30 SORT age ASC LIMIT 10;
PICK uid, username, score FROM users IN main WHERE score < 90 SORT score DESC LIMIT 10;
PICK uid, username, status FROM users IN main WHERE status != "deleted" LIMIT 10;
PICK uid, username, bio FROM users IN main WHERE bio ~= "user" LIMIT 10;

PICK uid, username FROM users IN main MAX(2);

EXPLAIN PICK uid, username, score FROM users IN main WHERE status = "active" SORT score DESC LIMIT 5 OFFSET 0;


