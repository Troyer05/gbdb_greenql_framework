# 37) FOR NUMERIC LOOP
# ============================================================

FOR (_i = 1; _i <= 3; _i++) {
    SEED audit_log WITH
        event_uid="event_for_inc_" + _i,
        entity="loop",
        entity_uid="for_inc",
        action="iteration",
        message="FOR increment iteration " + _i,
        created_at=NOW
    IN main;
};

FOR (_j = 3; _j > 0; _j--) {
    OUTPUT "Countdown: " + _j;
};


