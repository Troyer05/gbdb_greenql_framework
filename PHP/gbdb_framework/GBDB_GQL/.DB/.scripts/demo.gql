# ============================================================
# 00) META
# ============================================================

META = {
    "name": "greenQL Ultra Full Showcase",
    "file": "demo.gql",
    "version": "2.1.0",
    "description": "Full GreenQL showcase with executable safe core and commented edge-case syntax.",
    "safe_core": true
};


# ============================================================
# 01) OUTPUT / BASIC VALUES
# ============================================================

OUTPUT "============================================================";
OUTPUT "greenQL ULTRA FULL SHOWCASE START";
OUTPUT "============================================================";

OUTPUT ENV("api_auth");

DECLARE $SHOWCASE_VERSION = "2.1.0";
DECLARE _demo_instance = "demo_full_gql";
DECLARE _main_base = "main";
DECLARE _tmp_base = "tmp";
DECLARE _now = NOW;

OUTPUT {
    "showcase": $SHOWCASE_VERSION,
    "instance": _demo_instance,
    "now": _now
};


# ============================================================
# 02) PARAM / ENV
# ============================================================

# PARAM liest Runtime-Parameter, die z.B. von UI/API übergeben werden.
DECLARE _param_mode = PARAM("mode");
DECLARE _param_user = param("user");

# ENV liest Werte aus .config/.greenql.env.php
# Beispiel:
#   ENV("api_auth")
#
# Erwartete PHP-Datei-Idee:
#   <?php
#   return [
#       "api_auth" => "secret",
#       "api_base" => "https://example.local/api"
#   ];
#
DECLARE _env_api_auth = ENV("api_auth");
DECLARE _env_api_base = ENV("api_base");

OUTPUT {
    "param_mode": _param_mode,
    "param_user": _param_user,
    "env_api_auth": _env_api_auth,
    "env_api_base": _env_api_base
};


# ============================================================
# 03) RUNTIME IDs / HASH / LEN / BOOL / MATH
# ============================================================

DECLARE _uuid = uuid();
DECLARE _random_a = uni_random();
DECLARE _random_b = spark_id();
DECLARE _random_c = fresh_id();

DECLARE _hash_default = hash("demo-password");
DECLARE _hash_sha256 = hash_sha256("demo-password");
DECLARE _hash_sha512 = hash_sha512("demo-password");
DECLARE _hash_md5 = hash_md5("demo-password");
DECLARE _hash_adler32 = hash_adler32("demo-password");
DECLARE _hash_crc32 = hash_crc32("demo-password");
DECLARE _hash_custom = hash("sha256", "demo-password");

DECLARE _text = "greenQL";
DECLARE _text_len = len(_text);

DECLARE _math_add = 10 + 5;
DECLARE _math_sub = 10 - 5;
DECLARE _math_mul = 10 * 5;
DECLARE _math_div = 10 / 2;
DECLARE _math_mod = 10 % 3;

DECLARE _bool_eq = 10 == 10;
DECLARE _bool_neq = 10 != 11;
DECLARE _bool_gt = 10 > 5;
DECLARE _bool_lt = 5 < 10;
DECLARE _bool_gte = 10 >= 10;
DECLARE _bool_lte = 10 <= 10;
DECLARE _bool_and = true AND true;
DECLARE _bool_or = false OR true;
DECLARE _bool_and_symbol = true && true;
DECLARE _bool_or_symbol = false || true;
DECLARE _bool_not = !false;

OUTPUT {
    "ids": {
        "uuid": _uuid,
        "uni_random": _random_a,
        "spark_id": _random_b,
        "fresh_id": _random_c
    },
    "hash": {
        "default": _hash_default,
        "sha256": _hash_sha256,
        "sha512": _hash_sha512,
        "md5": _hash_md5,
        "adler32": _hash_adler32,
        "crc32": _hash_crc32,
        "custom": _hash_custom
    },
    "len": _text_len,
    "math": {
        "add": _math_add,
        "sub": _math_sub,
        "mul": _math_mul,
        "div": _math_div,
        "mod": _math_mod
    },
    "bool": {
        "eq": _bool_eq,
        "neq": _bool_neq,
        "gt": _bool_gt,
        "lt": _bool_lt,
        "gte": _bool_gte,
        "lte": _bool_lte,
        "and": _bool_and,
        "or": _bool_or,
        "and_symbol": _bool_and_symbol,
        "or_symbol": _bool_or_symbol,
        "not": _bool_not
    }
};


# ============================================================
# 04) DECLARE / DECALRE / DELACE / PUB / PRIV
# ============================================================

DECLARE _declared_normal = "DECLARE works";
DECALRE _declared_typo_alias = "DECALRE alias works";
DELACE _declared_legacy_alias = "DELACE legacy alias works";

PUB DECLARE _public_declared = "PUB DECLARE works";
PRIV DECLARE _private_declared = "PRIV DECLARE works";

DECLARE $CONST_DEMO = "constant-like variable with dollar prefix";

OUTPUT {
    "declare": _declared_normal,
    "decalre": _declared_typo_alias,
    "delace": _declared_legacy_alias,
    "pub": _public_declared,
    "priv": _private_declared,
