# ============================================================
# 28) SHARDING / CLUSTER
# ============================================================

REGISTER SHARD shard_main ROLE PRIMARY;
REGISTER SHARD shard_replica ROLE REPLICA;
REGISTER SHARD shard_worker ROLE WORKER;

SHOW SHARDS;

SHARD TABLE users BY HASH uid IN main;
