DECLARE _page_b = page("demo_full_gql", "main", "users", 1, 2);

DECLARE _cursor_a = cursor("main", "users", 2, "");
DECLARE _cursor_b = cursor("demo_full_gql", "main", "users", 2, "");

OUTPUT {
