# ============================================================
# 08) TABLE CREATION WITHOUT DATATYPES
# ============================================================

# Variante 1: klassische Klammer-Syntax
GROW TABLE users (
    uid,
    username,
    email,
    password,
    role,
    status,
    age,
    score,
    created_at,
    updated_at,
    bio,
    tenant_id,
    group_id
) IN main;

# Variante 2: WITH-Syntax
GROW TABLE posts WITH
    post_uid,
    user_uid,
    title,
    body,
    status,
    views,
    likes,
    created_at,
    updated_at,
    tenant_id
IN main;

GROW TABLE tags (
    tag_uid,
    post_uid,
    name,
    created_at
) IN main;

GROW TABLE audit_log (
    event_uid,
    entity,
    entity_uid,
    action,
    message,
    created_at
) IN main;

GROW TABLE tmp_items WITH
    item_uid,
    name,
    value,
    created_at
IN tmp;

SHOW TABLES IN main;
SHOW TABLES IN tmp;

BRANCH users;

DECLARE _table_exists_command = EXISTS TABLE "users";
DECLARE _table_exists_fn = table_exists("main", "users");

OUTPUT {
    "exists_table_command": _table_exists_command,
    "exists_table_fn": _table_exists_fn
};


# ============================================================
# 09) TABLE CREATION WITH DATATYPES
# ============================================================
#
# WICHTIG:
# Im aktuell sichtbaren Parser-ZIP ist typed GROW TABLE nicht sicher
# ausführbar, weil GROW TABLE nur eine Spaltenliste parst.
#
# Trotzdem gehört es in die Showcase-/Extension-Welt, wenn GreenQL typed
# tables bekommen soll oder bereits in deiner lokalen Version hat.
#
# Mögliche Syntax-Beispiele für Extension/Docs/Snippets:
#
GROW TABLE typed_users (
    typed_uid:string REQUIRED UNIQUE,
    username:string REQUIRED UNIQUE,
    email:email REQUIRED,
    age:int DEFAULT 0,
    score:float DEFAULT 0.0,
    active:bool DEFAULT true,
    created_at:datetime DEFAULT NOW,
    meta:json DEFAULT {}
) IN main;

GROW TABLE typed_products WITH
    product_uid:string REQUIRED UNIQUE,
    name:string REQUIRED,
    price:float DEFAULT 0.0,
    stock:int DEFAULT 0,
    active:bool DEFAULT true,
    created_at:datetime DEFAULT NOW
IN main;

GROW TABLE typed_logs (
    event_uid STRING REQUIRED UNIQUE,
    level STRING DEFAULT "info",
    message TEXT DEFAULT "",
    payload JSON DEFAULT {},
    created_at DATETIME DEFAULT NOW
) IN main;

# Explizit ohne aktive Type-Prüfung trotz Typnotation:
GROW TABLE typed_but_loose (
    uid:string,
    payload:json
) WITHOUT TYPES IN main;

ALTER TABLE users ADD COLUMN typed_score:int DEFAULT 0 IN main;
ALTER TABLE users ADD COLUMN typed_meta:json DEFAULT {} IN main;

SEED typed_users WITH
    typed_uid=uuid(),
    username="typed_admin",
    email="typed-admin@example.local",
    age=33,
    score=88.5,
    active=true,
    created_at=NOW,
    meta={"source":"demo.gql","typed":true}
IN main;

PICK typed_uid, username, email, age, score, active FROM typed_users IN main LIMIT 10;
DESCRIBE typed_users IN main;


