# ============================================================
# 36) IF / ELSE
# ============================================================

IF (_count_users > 0) {
    OUTPUT "IF: users exist";

    SEED audit_log WITH
        event_uid="event_if_true",
        entity="control_flow",
        entity_uid="if",
        action="true",
        message="IF true branch executed",
        created_at=NOW
    IN main;
} ELSE {
    OUTPUT "ELSE: no users found";

    SEED audit_log WITH
        event_uid="event_if_false",
        entity="control_flow",
        entity_uid="if",
        action="false",
        message="ELSE branch executed",
        created_at=NOW
    IN main;
};

IF (_count_users == 0) {
    OUTPUT "No users";
} ELSE IF (_count_users > 0) {
    OUTPUT "ELSE IF: users found";
} ELSE {
    OUTPUT "Fallback";
};


