F make_label(_prefix, _value) {
    DECLARE _label = _prefix + ": " + _value;
    BACK _label;
};

DECLARE _label_direct = CALL make_label("User", "admin");
DECLARE _label_runtime = make_label("Role", "editor");

OUTPUT {
    "label_direct": _label_direct,
    "label_runtime": _label_runtime
};

F add_numbers(_a, _b) {
    DECLARE _sum = _a + _b;
    BACK _sum;
};

DECLARE _sum_result = CALL add_numbers(7, 5);

OUTPUT {
    "sum_result": _sum_result
};


# ============================================================
# 41) CLASSES / C / CLASS / PUB F / PRIV F / this
# ============================================================

CLASS DemoService {
    PUB DECLARE _service_name = "DemoService";
    PRIV DECLARE _counter = 0;

    PUB F hello(_name) {
        BACK "Hello " + _name + " from " + _service_name;
    };

    PUB F increment() {
        this._counter = _counter + 1;
        BACK _counter;
    };

    PRIV F internal_note() {
        BACK "internal";
    };
};

DECLARE _class_hello = CLASS DemoService/hello("Markus");
DECLARE _class_inc_1 = CLASS DemoService/increment();
DECLARE _class_inc_2 = CALL DemoService/increment();

OUTPUT {
    "class_hello": _class_hello,
    "class_inc_1": _class_inc_1,
    "class_inc_2": _class_inc_2
};

C MiniService {
    PUB DECLARE _name = "MiniService";

    PUB F get_name() {
        BACK _name;
    };
};

DECLARE _mini_name = CLASS MiniService/get_name();

OUTPUT {
    "mini_name": _mini_name
};


