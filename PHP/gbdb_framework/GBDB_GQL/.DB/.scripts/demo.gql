# ============================================================
# 22) TRANSACTIONS / SAVEPOINTS
# ============================================================

TX TIMEOUT 60;

BEGIN TRANSACTION;

SEED audit_log WITH
    event_uid="event_tx_before_savepoint",
    entity="transaction",
    entity_uid="tx",
    action="insert",
    message="Before savepoint",
    created_at=NOW
IN main;

SAVEPOINT sp_before_second_insert;

SEED audit_log WITH
    event_uid="event_tx_rollback_target",
    entity="transaction",
    entity_uid="tx",
    action="insert",
    message="This should be rolled back to savepoint",
    created_at=NOW
IN main;

SHOW TRANSACTION;

ROLLBACK TO sp_before_second_insert;

SEED audit_log WITH
    event_uid="event_tx_after_rollback_to",
    entity="transaction",
    entity_uid="tx",
    action="insert",
    message="After rollback to savepoint",
    created_at=NOW
IN main;

COMMIT TRANSACTION;

PICK event_uid, action, message FROM audit_log IN main WHERE entity = "transaction" LIMIT 20;

BEGIN;
SEED audit_log WITH event_uid="event_full_rollback", entity="rollback", entity_uid="rb", action="insert", message="This should be fully rolled back", created_at=NOW IN main;
ROLLBACK;

PICK event_uid, entity, action FROM audit_log IN main WHERE event_uid = "event_full_rollback" LIMIT 5;


# ============================================================
# 23) QUERY OPTIONS / PREPARE / EXECUTE
# ============================================================

QUERY OPTIONS {
    "limit": 100,
    "explain": true,
    "cache": false
};

PREPARE active_users AS PICK uid, username, role, status FROM users IN main WHERE status = "active" SORT username ASC LIMIT 20;

EXECUTE active_users;

EXECUTE active_users WITH {
    "status": "active"
};


