# 25) HEALTH / CHECK / REPAIR / SNAPSHOT / META / PACK
# ============================================================

CHECK users IN main;
HEALTH users IN main;

SHOW META FROM users IN main;

SNAPSHOT users IN main;

REPAIR users IN main;
RECOVER users IN main;

PACK users IN main;


# ============================================================
# 26) STATS / ANALYZE / MONITOR / INDEX SUGGESTIONS
# ============================================================

STATS users IN main;
ANALYZE users IN main;
ANALYZE main.users;

SUGGEST INDEXES users IN main;
INDEX SUGGESTIONS users IN main;
INDEX SUGGESTIONS main.users;

AUTO INDEX users IN main COLUMNS uid, username, status, score;

MONITOR;
MONITOR users IN main;
MONITOR main.users;

DECLARE _monitor_a = monitor();
DECLARE _monitor_b = monitor("main", "users");
DECLARE _monitor_c = monitor("demo_full_gql", "main", "users");

DECLARE _recover_a = recover("main", "users");
DECLARE _recover_b = recover("demo_full_gql", "main", "users");

OUTPUT {
    "monitor_a": _monitor_a,
    "monitor_b": _monitor_b,
    "monitor_c": _monitor_c,
    "recover_a": _recover_a,
    "recover_b": _recover_b
};


